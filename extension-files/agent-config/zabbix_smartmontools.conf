# invoke /usr/bin/zabbix_discovery_devices --help to view information about configuration format
UserParameter=vfs.dev.discovery.smart,/usr/bin/zabbix_discovery_devices --config /etc/zabbix/item_zabbix_discovery_devices.json --only_rawdisk --smart 2>/dev/null
#
UserParameter=hardware.disk.health[*],sudo /usr/bin/zabbix_check_smartmontools --health --device "$1" 2>/dev/null
UserParameter=hardware.disk.smart.attributes[*],sudo /usr/bin/zabbix_check_smartmontools --device "$1" --attribute "$2" 2>/dev/null
UserParameter=hardware.disk.smart.info[*],sudo /usr/bin/zabbix_check_smartmontools --device "$1" --info "$2" 2>/dev/null

